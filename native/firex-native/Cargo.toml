[package]
name = "firex-native"
version = "1.0.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1.0"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "time"] }
